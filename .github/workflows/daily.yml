name: daily-post
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests feedparser
      - run: python post.py
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASS: ${{ secrets.WP_APP_PASS }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
